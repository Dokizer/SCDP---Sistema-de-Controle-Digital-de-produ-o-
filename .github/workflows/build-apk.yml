name: Gerar e Publicar APK (Build & Release)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compilar APKs (Release e Debug)
        run: |
          chmod +x gradlew || true
          gradle assembleRelease assembleDebug

      - name: Disponibilizar APKs como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: SCDP-apks
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk

      - name: Renomear APK de Release para publicação
        run: |
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/SCDP-v1.1-release.apk

      - name: Criar ou Atualizar Release Oficial com o APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.0
          name: SCDP v1.1.0 - Versão Oficial Release (Download APK)
          body: |
            ### 📱 SCDP - Sistema de Controle Digital de Produção (Farinhas CJ)
            
            Versão oficial de **Release** compilada e pronta para uso operacional no chão de fábrica.
            
            #### 📦 Arquivos para Download:
            - **`SCDP-v1.1-release.apk`** (Recomendado - 13 MB): Versão final de produção, estável e otimizada.
            - **`app-debug.apk`**: Versão de testes/depuração.
            
            #### 📲 Como Instalar:
            1. Baixe o **`SCDP-v1.1-release.apk`** no celular ou tablet Android.
            2. Abra o arquivo baixado para iniciar a instalação.
            3. Se o Android perguntar, permita a instalação a partir do navegador/arquivos ("Instalar apps desconhecidos").
            4. Abra o SCDP e use normalmente!
          files: |
            app/build/outputs/apk/release/SCDP-v1.1-release.apk
            app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
